version: '3.8'

services:
  # 1. Konfigurasi Gerbang Utama (Load Balancer)
  lb_nginx:
    image: nginx:alpine
    ports:
      - "8080:80" # Akses dari browser via localhost:8080
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web_a
      - web_b
      - web_c

  # 2. Konfigurasi Server A
  web_a:
    image: php:8.2-apache
    volumes:
      - ./index.php:/var/www/html/index.php

  # 3. Konfigurasi Server B
  web_b:
    image: php:8.2-apache
    volumes:
      - ./index.php:/var/www/html/index.php

  # 4. Konfigurasi Server C
  web_c:
    image: php:8.2-apache
    volumes:
      - ./index.php:/var/www/html/index.php